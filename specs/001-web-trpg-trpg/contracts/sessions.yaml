openapi: 3.0.3
info:
  title: Sessions API - 非同期TRPG風ゲーム
  description: セッション管理・ゲームプレイAPI
  version: 0.1.0

paths:
  /sessions:
    get:
      summary: セッション一覧取得
      description: 参加可能または参加中のセッション一覧を取得
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SessionStatus'
          description: セッションステータスフィルター
        - name: player_id
          in: query
          schema:
            type: string
            format: uuid
          description: 特定プレイヤーのセッションのみ取得
      responses:
        '200':
          description: セッション一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionSummary'
                  total:
                    type: integer
                required:
                  - sessions
                  - total

    post:
      summary: 新規セッション作成
      description: GMが新しいセッションを作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: セッション作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '400':
          description: 入力エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /sessions/{sessionId}:
    get:
      summary: セッション詳細取得
      description: 指定されたセッションの詳細情報を取得
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: セッション詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '404':
          description: セッションが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

    put:
      summary: セッション設定更新
      description: セッションの設定を更新（GM権限必要）
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'

  /sessions/{sessionId}/players:
    post:
      summary: セッション参加申請
      description: プレイヤーがセッションへの参加を申請
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinSessionRequest'
      responses:
        '200':
          description: 参加申請成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '409':
          description: 参加条件に合わない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'

    put:
      summary: プレイヤー承認・管理
      description: GMがプレイヤーの参加を承認・管理
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagePlayersRequest'
      responses:
        '200':
          description: プレイヤー管理成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'

  /sessions/{sessionId}/start:
    post:
      summary: セッション開始
      description: GMがセッションを開始
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: セッション開始成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '400':
          description: 開始条件を満たしていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /sessions/{sessionId}/actions:
    post:
      summary: ゲームアクション実行
      description: プレイヤーがゲーム内アクションを実行
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameActionRequest'
      responses:
        '200':
          description: アクション実行成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameActionResult'
        '400':
          description: 実行不可能なアクション
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /sessions/{sessionId}/log:
    get:
      summary: セッションログ取得
      description: セッションのイベントログを取得
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          schema:
            type: integer
            minimum: 0
          description: 指定シーケンス番号以降のログを取得
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: 取得件数制限
      responses:
        '200':
          description: ログエントリ
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/LogEntry'
                  has_more:
                    type: boolean
                  next_sequence:
                    type: integer
                required:
                  - entries
                  - has_more

  /sessions/{sessionId}/state:
    get:
      summary: ゲーム状態取得
      description: 現在のゲーム状態スナップショットを取得
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ゲーム状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'

components:
  schemas:
    SessionSummary:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        scenario_name:
          type: string
        gm_name:
          type: string
        status:
          $ref: '#/components/schemas/SessionStatus'
        current_players:
          type: integer
          minimum: 0
        max_players:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
      required:
        - session_id
        - scenario_name
        - gm_name
        - status
        - current_players
        - max_players
        - created_at

    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          properties:
            scenario_id:
              type: string
              format: uuid
            gm_user_id:
              type: string
              format: uuid
            players:
              type: array
              items:
                $ref: '#/components/schemas/SessionPlayer'
            current_scene:
              $ref: '#/components/schemas/SceneState'
            shared_cards:
              type: array
              items:
                $ref: '#/components/schemas/Card'
            session_settings:
              $ref: '#/components/schemas/SessionSettings'
            updated_at:
              type: string
              format: date-time
          required:
            - scenario_id
            - gm_user_id
            - players
            - session_settings

    SessionPlayer:
      type: object
      properties:
        player_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
        character:
          $ref: '#/components/schemas/SessionCharacter'
        status:
          $ref: '#/components/schemas/PlayerStatus'
        joined_at:
          type: string
          format: date-time
        last_action_at:
          type: string
          format: date-time
          nullable: true
      required:
        - player_id
        - user_id
        - user_name
        - character
        - status
        - joined_at

    SessionCharacter:
      type: object
      properties:
        character_id:
          type: string
          format: uuid
        name:
          type: string
        session_cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        session_tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        character_status:
          $ref: '#/components/schemas/CharacterStatus'
      required:
        - character_id
        - name
        - session_cards
        - session_tags
        - character_status

    SceneState:
      type: object
      properties:
        scene_id:
          type: string
          format: uuid
        scene_name:
          type: string
        status:
          $ref: '#/components/schemas/SceneStatus'
        active_events:
          type: array
          items:
            $ref: '#/components/schemas/EventInstance'
        completion_progress:
          $ref: '#/components/schemas/CompletionProgress'
        participants:
          type: array
          items:
            type: string
            format: uuid
      required:
        - scene_id
        - scene_name
        - status
        - active_events
        - completion_progress
        - participants

    Card:
      type: object
      properties:
        card_id:
          type: string
          format: uuid
        name:
          type: string
        card_type:
          $ref: '#/components/schemas/CardType'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        rarity:
          $ref: '#/components/schemas/Rarity'
        description:
          type: string
        usable:
          type: boolean
        usage_count:
          type: integer
          minimum: 0
      required:
        - card_id
        - name
        - card_type
        - rarity
        - usable

    Tag:
      type: object
      properties:
        name:
          type: string
        category:
          $ref: '#/components/schemas/TagCategory'
        value:
          oneOf:
            - type: integer
            - type: boolean
            - type: string
          nullable: true
      required:
        - name
        - category

    GameState:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        current_scene:
          $ref: '#/components/schemas/SceneState'
        players:
          type: array
          items:
            $ref: '#/components/schemas/SessionPlayer'
        shared_cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        pending_actions:
          type: array
          items:
            $ref: '#/components/schemas/PendingAction'
        last_updated:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 0
      required:
        - session_id
        - current_scene
        - players
        - shared_cards
        - pending_actions
        - last_updated
        - version

    LogEntry:
      type: object
      properties:
        sequence_id:
          type: integer
          minimum: 0
        timestamp:
          type: string
          format: date-time
        event_type:
          $ref: '#/components/schemas/LogEventType'
        actor:
          type: string
          format: uuid
          nullable: true
        content:
          $ref: '#/components/schemas/LogContent'
        visibility:
          $ref: '#/components/schemas/Visibility'
      required:
        - sequence_id
        - timestamp
        - event_type
        - content
        - visibility

    CreateSessionRequest:
      type: object
      properties:
        scenario_id:
          type: string
          format: uuid
        max_players:
          type: integer
          minimum: 1
          maximum: 10
        recruitment_message:
          type: string
          maxLength: 500
          nullable: true
        session_settings:
          $ref: '#/components/schemas/SessionSettings'
      required:
        - scenario_id
        - max_players

    JoinSessionRequest:
      type: object
      properties:
        character_id:
          type: string
          format: uuid
        message:
          type: string
          maxLength: 200
          nullable: true
      required:
        - character_id

    GameActionRequest:
      type: object
      properties:
        action_type:
          $ref: '#/components/schemas/GameActionType'
        parameters:
          type: object
          additionalProperties: true
        player_id:
          type: string
          format: uuid
      required:
        - action_type
        - player_id

    GameActionResult:
      type: object
      properties:
        success:
          type: boolean
        result:
          type: object
          additionalProperties: true
        events_generated:
          type: array
          items:
            $ref: '#/components/schemas/EventInstance'
        state_changes:
          type: array
          items:
            $ref: '#/components/schemas/StateChange'
        message:
          type: string
          nullable: true
      required:
        - success
        - result
        - events_generated
        - state_changes

    # Enums and other types
    SessionStatus:
      type: string
      enum:
        - created
        - recruiting
        - starting
        - in_progress
        - paused
        - completed
        - terminated

    PlayerStatus:
      type: string
      enum:
        - pending
        - active
        - inactive
        - departed

    CharacterStatus:
      type: string
      enum:
        - ready
        - in_action
        - waiting_for_input
        - incapacitated

    SceneStatus:
      type: string
      enum:
        - entering
        - active
        - resolving
        - completed

    CardType:
      type: string
      enum:
        - action
        - choice
        - possession
        - scene_transition

    TagCategory:
      type: string
      enum:
        - skill
        - status
        - achievement
        - condition

    Rarity:
      type: string
      enum:
        - common
        - uncommon
        - rare
        - legendary

    LogEventType:
      type: string
      enum:
        - system_message
        - player_action
        - dice_roll
        - card_usage
        - scene_change
        - roleplay

    Visibility:
      type: string
      enum:
        - all
        - gm
        - player
        - party

    GameActionType:
      type: string
      enum:
        - use_card
        - roll_dice
        - propose_choice
        - roleplay_message
        - request_scene_transition

    EventInstance:
      type: object
      properties:
        instance_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_name:
          type: string
        event_type:
          type: string
        status:
          type: string
          enum:
            - pending
            - active
            - resolving
            - completed
        triggered_at:
          type: string
          format: date-time
        parameters:
          type: object
          additionalProperties: true
      required:
        - instance_id
        - event_id
        - event_name
        - event_type
        - status
        - triggered_at

    CompletionProgress:
      type: object
      properties:
        total_conditions:
          type: integer
          minimum: 0
        completed_conditions:
          type: integer
          minimum: 0
        percentage:
          type: number
          minimum: 0
          maximum: 100
        details:
          type: array
          items:
            type: object
            properties:
              condition_id:
                type: string
              description:
                type: string
              completed:
                type: boolean
            required:
              - condition_id
              - description
              - completed
      required:
        - total_conditions
        - completed_conditions
        - percentage

    PendingAction:
      type: object
      properties:
        action_id:
          type: string
          format: uuid
        player_id:
          type: string
          format: uuid
        action_type:
          $ref: '#/components/schemas/GameActionType'
        required_by:
          type: string
          format: date-time
        parameters:
          type: object
          additionalProperties: true
      required:
        - action_id
        - player_id
        - action_type

    StateChange:
      type: object
      properties:
        change_type:
          type: string
          enum:
            - card_added
            - card_removed
            - tag_added
            - tag_removed
            - scene_changed
            - player_status_changed
        target:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - change_type
        - target
        - details

    SessionSettings:
      type: object
      properties:
        allow_observer:
          type: boolean
          default: false
        auto_advance_scenes:
          type: boolean
          default: false
        dice_visibility:
          type: string
          enum:
            - all
            - gm_only
            - player_only
          default: all
        inactivity_timeout:
          type: string
          description: ISO 8601 duration
          default: P7D
      required:
        - allow_observer
        - auto_advance_scenes
        - dice_visibility
        - inactivity_timeout

    LogContent:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          additionalProperties: true
          nullable: true
      required:
        - message

    UpdateSessionRequest:
      type: object
      properties:
        max_players:
          type: integer
          minimum: 1
          maximum: 10
        recruitment_message:
          type: string
          maxLength: 500
          nullable: true
        session_settings:
          $ref: '#/components/schemas/SessionSettings'

    ManagePlayersRequest:
      type: object
      properties:
        actions:
          type: array
          items:
            type: object
            properties:
              player_id:
                type: string
                format: uuid
              action:
                type: string
                enum:
                  - approve
                  - reject
                  - kick
                  - set_status
              parameters:
                type: object
                additionalProperties: true
            required:
              - player_id
              - action
      required:
        - actions

    ValidationError:
      type: object
      properties:
        error:
          type: string
          enum:
            - validation_failed
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
            required:
              - field
              - code
              - message
      required:
        - error
        - message

    ConflictError:
      type: object
      properties:
        error:
          type: string
          enum:
            - conflict
        message:
          type: string
        conflict_type:
          type: string
          enum:
            - session_full
            - character_already_participating
            - scenario_restriction
            - status_not_allowed
      required:
        - error
        - message
        - conflict_type

    NotFoundError:
      type: object
      properties:
        error:
          type: string
          enum:
            - not_found
        message:
          type: string
      required:
        - error
        - message