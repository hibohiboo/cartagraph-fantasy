openapi: 3.0.3
info:
  title: Scenarios API - 非同期TRPG風ゲーム
  description: シナリオ作成・管理API
  version: 0.1.0

paths:
  /scenarios:
    get:
      summary: 公開シナリオ一覧取得
      description: 公開されているシナリオ一覧を取得
      parameters:
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
          description: フィルタリング用タグ
        - name: difficulty
          in: query
          schema:
            $ref: '#/components/schemas/Difficulty'
          description: 難易度フィルター
        - name: player_count
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
          description: 推奨プレイヤー数
      responses:
        '200':
          description: シナリオ一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScenarioSummary'
                  total:
                    type: integer
                required:
                  - scenarios
                  - total

    post:
      summary: 新規シナリオ作成
      description: 新しいシナリオを作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScenarioRequest'
      responses:
        '201':
          description: シナリオ作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioDetail'
        '400':
          description: 入力エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /scenarios/{scenarioId}:
    get:
      summary: シナリオ詳細取得
      description: 指定されたシナリオの詳細情報を取得
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: シナリオ詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioDetail'
        '404':
          description: シナリオが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

    put:
      summary: シナリオ更新
      description: 既存シナリオを更新
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScenarioRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioDetail'
        '404':
          description: シナリオが見つからない

  /scenarios/{scenarioId}/derive:
    post:
      summary: 派生シナリオ作成
      description: 既存シナリオを元に派生シナリオを作成
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeriveScenarioRequest'
      responses:
        '201':
          description: 派生シナリオ作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioDetail'

components:
  schemas:
    ScenarioSummary:
      type: object
      properties:
        scenario_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        author_name:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        recommended_players:
          $ref: '#/components/schemas/PlayerRange'
        estimated_duration:
          type: string
          description: ISO 8601 duration format
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
      required:
        - scenario_id
        - name
        - description
        - author_name
        - difficulty
        - recommended_players

    ScenarioDetail:
      allOf:
        - $ref: '#/components/schemas/ScenarioSummary'
        - type: object
          properties:
            version:
              type: integer
              minimum: 1
            author_id:
              type: string
              format: uuid
            scenes:
              type: array
              items:
                $ref: '#/components/schemas/SceneDefinition'
            initial_scene_id:
              type: string
              format: uuid
            shared_cards:
              type: array
              items:
                $ref: '#/components/schemas/CardTemplate'
            derived_from:
              type: string
              format: uuid
              nullable: true
            updated_at:
              type: string
              format: date-time
          required:
            - version
            - author_id
            - scenes
            - initial_scene_id
            - shared_cards

    SceneDefinition:
      type: object
      properties:
        scene_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        objective:
          type: string
          maxLength: 500
        completion_condition:
          $ref: '#/components/schemas/CompletionCondition'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventDefinition'
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/SceneTransition'
      required:
        - scene_id
        - name
        - description
        - objective
        - completion_condition
        - events
        - transitions

    EventDefinition:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        event_type:
          $ref: '#/components/schemas/EventType'
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/EventTrigger'
        effects:
          type: array
          items:
            $ref: '#/components/schemas/EventEffect'
        message:
          type: string
          maxLength: 1000
      required:
        - event_id
        - name
        - event_type
        - triggers
        - effects
        - message

    CardTemplate:
      type: object
      properties:
        card_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
        card_type:
          $ref: '#/components/schemas/CardType'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        embedded_events:
          type: array
          items:
            type: string
            format: uuid
        rarity:
          $ref: '#/components/schemas/Rarity'
        description:
          type: string
          maxLength: 200
      required:
        - card_id
        - name
        - card_type
        - rarity

    CreateScenarioRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        recommended_players:
          $ref: '#/components/schemas/PlayerRange'
        estimated_duration:
          type: string
        tags:
          type: array
          items:
            type: string
        initial_scene:
          $ref: '#/components/schemas/SceneDefinition'
      required:
        - name
        - description
        - difficulty
        - recommended_players
        - initial_scene

    UpdateScenarioRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        recommended_players:
          $ref: '#/components/schemas/PlayerRange'
        estimated_duration:
          type: string
        tags:
          type: array
          items:
            type: string
        scenes:
          type: array
          items:
            $ref: '#/components/schemas/SceneDefinition'
        shared_cards:
          type: array
          items:
            $ref: '#/components/schemas/CardTemplate'

    DeriveScenarioRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        modifications:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioModification'
      required:
        - name
        - description

    Difficulty:
      type: string
      enum:
        - beginner
        - intermediate
        - advanced
        - expert

    PlayerRange:
      type: object
      properties:
        min:
          type: integer
          minimum: 1
        max:
          type: integer
          minimum: 1
      required:
        - min
        - max

    EventType:
      type: string
      enum:
        - narrative
        - action
        - possession
        - scene_transition
        - card_distribution

    CardType:
      type: string
      enum:
        - action
        - choice
        - possession
        - scene_transition

    Rarity:
      type: string
      enum:
        - common
        - uncommon
        - rare
        - legendary

    Tag:
      type: object
      properties:
        name:
          type: string
          maxLength: 30
        category:
          $ref: '#/components/schemas/TagCategory'
        value:
          oneOf:
            - type: integer
            - type: boolean
            - type: string
              maxLength: 100
          nullable: true
      required:
        - name
        - category

    TagCategory:
      type: string
      enum:
        - skill
        - status
        - achievement
        - condition

    CompletionCondition:
      type: object
      properties:
        type:
          type: string
          enum:
            - all_events_completed
            - specific_event_triggered
            - card_usage_condition
            - time_based
        parameters:
          type: object
          additionalProperties: true
      required:
        - type
        - parameters

    SceneTransition:
      type: object
      properties:
        target_scene_id:
          type: string
          format: uuid
        condition:
          $ref: '#/components/schemas/TransitionCondition'
        trigger_type:
          type: string
          enum:
            - automatic
            - player_choice
            - gm_decision
            - event_based
      required:
        - target_scene_id
        - condition
        - trigger_type

    TransitionCondition:
      type: object
      properties:
        type:
          type: string
          enum:
            - completion_condition_met
            - specific_card_used
            - dice_roll_result
            - tag_possession
            - gm_override
        parameters:
          type: object
          additionalProperties: true
      required:
        - type

    EventTrigger:
      type: object
      properties:
        type:
          type: string
          enum:
            - session_start
            - card_usage
            - scene_entry
            - gm_manual
            - event_completion
        condition:
          type: object
          additionalProperties: true
      required:
        - type

    EventEffect:
      type: object
      properties:
        type:
          type: string
          enum:
            - message_display
            - card_distribution
            - tag_addition
            - dice_roll_request
            - scene_transition
        parameters:
          type: object
          additionalProperties: true
      required:
        - type
        - parameters

    ScenarioModification:
      type: object
      properties:
        type:
          type: string
          enum:
            - scene_modification
            - event_addition
            - card_modification
            - parameter_change
        target_id:
          type: string
          format: uuid
        changes:
          type: object
          additionalProperties: true
      required:
        - type
        - target_id
        - changes

    ValidationError:
      type: object
      properties:
        error:
          type: string
          enum:
            - validation_failed
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
            required:
              - field
              - code
              - message
      required:
        - error
        - message

    NotFoundError:
      type: object
      properties:
        error:
          type: string
          enum:
            - not_found
        message:
          type: string
      required:
        - error
        - message