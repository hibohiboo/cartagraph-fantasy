[package]
name = "cartagraph-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tsify = "0.4"
ts-rs = { version = "7.1", features = ["serde-compat"] }
uuid = { version = "1.6", features = ["v4", "wasm-bindgen", "serde"] }
chrono = { version = "0.4", features = ["wasm-bindgen", "serde"] }
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.getrandom]
version = "0.2"
features = ["js"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = []