[package]
name = "cartagraph-core"
version = "0.1.0"
edition = "2021"
description = "Core game logic for Cartagraph Fantasy TRPG-style game"
repository = "https://github.com/hibohiboo/cartagraph-fantasy"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
tsify = "0.5"
# serde(transparent) で 「 warning: failed to parse serde attribute 」 が発生するので no-serde-warnings で抑制
ts-rs = { version = "11.0", features = ["serde-compat", "no-serde-warnings"] }
uuid = { version = "1.18", features = ["v4", "js", "serde"] }
chrono = { version = "0.4", features = ["wasm-bindgen", "serde"] }
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"


[features]
default = []