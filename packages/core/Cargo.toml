[package]
name = "cartagraph-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tsify = "0.4"
uuid = { version = "1.6", features = ["v4", "wasm-bindgen"] }
chrono = { version = "0.4", features = ["wasm-bindgen"] }
js-sys = "0.3"
web-sys = "0.3"

[dependencies.getrandom]
version = "0.2"
features = ["js"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["console_error_panic_hook"]