<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM Browser Integration Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #1e1e1e;
            color: #d4d4d4;
        }
        .test-result {
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
        }
        .success {
            background-color: #1e4c2e;
            border-left: 4px solid #4caf50;
        }
        .error {
            background-color: #4c1e1e;
            border-left: 4px solid #f44336;
        }
        .info {
            background-color: #1e2d4c;
            border-left: 4px solid #2196f3;
        }
        pre {
            background-color: #2d2d2d;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🦀 WASM Browser Integration Test</h1>
    <div id="test-output"></div>

    <script type="module">
        const output = document.getElementById('test-output');

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            output.appendChild(div);
        }

        async function testBrowserIntegration() {
            try {
                log('🚀 Starting browser WASM integration test...', 'info');

                // Check browser compatibility
                log('Checking browser compatibility...', 'info');

                if (typeof WebAssembly === 'undefined') {
                    throw new Error('WebAssembly not supported in this browser');
                }
                log('✅ WebAssembly supported', 'success');

                if (typeof import.meta === 'undefined') {
                    throw new Error('ES modules not supported in this browser');
                }
                log('✅ ES modules supported', 'success');

                // Dynamic import of WASM module
                log('Loading WASM module...', 'info');
                const wasmModule = await import('./pkg/cartagraph_core.js');
                log('✅ WASM module imported successfully', 'success');

                // Initialize WASM
                log('Initializing WASM...', 'info');
                await wasmModule.default();
                log('✅ WASM initialized successfully', 'success');

                // Call main function
                log('Calling WASM main function...', 'info');
                wasmModule.main();
                log('✅ WASM main function executed successfully', 'success');

                // Check memory info
                if (performance.memory) {
                    const memInfo = {
                        usedJSHeapSize: Math.round(performance.memory.usedJSHeapSize / 1024),
                        totalJSHeapSize: Math.round(performance.memory.totalJSHeapSize / 1024),
                        jsHeapSizeLimit: Math.round(performance.memory.jsHeapSizeLimit / 1024)
                    };
                    log(`Memory: Used ${memInfo.usedJSHeapSize}KB / Total ${memInfo.totalJSHeapSize}KB`, 'info');
                }

                log('🎉 All browser integration tests passed!', 'success');

            } catch (error) {
                log(`❌ Browser integration test failed: ${error.message}`, 'error');
                log(`Stack trace: ${error.stack}`, 'error');
            }
        }

        // Run test
        testBrowserIntegration();
    </script>
</body>
</html>
